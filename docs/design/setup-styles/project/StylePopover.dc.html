<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Style picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1264A3}a:hover{color:#0B4C8C}
</style>
</helmet>
<div style="width: 1120px; height: 620px; box-sizing: border-box; padding: 24px; background: #9A9A9A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #1D1C1D; position: relative">
<div style="width: 1072px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.28); overflow: hidden; opacity: 0.55">
<div style="padding: 20px 28px 18px; border-bottom: 1px solid #E8E8E8; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #616061">Your draft</span>
<div style="background: #F8F8F8; border: 1px solid #EBEBEB; border-radius: 8px; padding: 12px 14px; font-size: 15px; line-height: 1.55">hi 那个报告我看了 有几个地方数据不对 你明天之前改一下吧 不然周五没法给客户</div>
</div>
<div style="background: #F4F4F5; padding: 20px 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; height: 250px">
<div style="background: #FFFFFF; border: 2px solid #1264A3; border-radius: 10px"></div>
<div style="background: #FFFFFF; border: 1px solid #DDDDDD; border-radius: 10px"></div>
<div style="background: #FFFFFF; border: 1px solid #DDDDDD; border-radius: 10px"></div>
</div>
</div>

<div style="position: absolute; left: 420px; top: 140px; width: 340px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,0.30); border: 1px solid #DDDDDD; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; font-weight: 700">Card 2 style</span>
<span style="font-size: 12px; color: #616061">Saved for next time</span>
</div>
<div style="display: flex; flex-direction: column; padding: 0 8px 8px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="6">
<button onClick="{{p.pick}}" style="{{p.rowStyle}}">
<span style="display: flex; flex-direction: column; gap: 2px; align-items: flex-start">
<span style="font-size: 14px; font-weight: 600; color: #1D1C1D">{{p.name}}</span>
<span style="font-size: 12px; color: #616061">{{p.hint}}</span>
</span>
<sc-if value="{{p.on}}" hint-placeholder-val="{{ false }}">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1264A3" stroke-width="2" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg>
</sc-if>
</button>
</sc-for>
</div>
<div style="border-top: 1px solid #E8E8E8; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 8px; background: #FAFAFA">
<label for="custom" style="font-size: 12px; font-weight: 600; color: #616061">Or describe your own</label>
<input id="custom" placeholder="e.g. Polite English, keep it under 2 sentences" style="height: 34px; border: 1px solid #BBBBBB; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; color: #1D1C1D; background: #FFFFFF">
<span style="font-size: 12px; color: #616061">Picking a style rewrites just this card (~1 s).</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":620}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 1 }; }
  renderVals() {
    const list = [
      ['Direct', 'Lead with the point'],
      ['Friendly', 'Relaxed, not stiff'],
      ['Clear', 'One idea per sentence'],
      ['Shorter', 'Same message, half the words'],
      ['Formal', 'For clients and leadership'],
      ['Polished English', 'Translate and tidy into English']
    ];
    const presets = list.map(([name, hint], i) => {
      const on = i === this.state.sel;
      return { name, hint, on, pick: () => this.setState({ sel: i }),
        rowStyle: 'display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; border-radius: 8px; padding: 8px 10px; font: inherit; text-align: left; cursor: pointer; background: ' + (on ? '#E8F1FA' : 'transparent') };
    });
    return { presets };
  }
}
</script>
</body>
</html>
