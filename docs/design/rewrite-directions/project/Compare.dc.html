<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>B 并排对比</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0A64D6}a:hover{color:#084FA8}
button{font:inherit;cursor:pointer}
textarea{font:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif; background: #E9E6E1">
  <div aria-hidden="true" style="position: absolute; left: 120px; top: 70px; width: 1200px; height: 760px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 20px 60px rgba(0,0,0,0.18); display: flex; overflow: hidden">
    <div style="width: 240px; background: #3F0E40"></div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; gap: 16px">
      <div style="height: 14px; width: 40%; background: #ECEAE6; border-radius: 7px"></div>
      <div style="height: 14px; width: 62%; background: #ECEAE6; border-radius: 7px"></div>
      <div style="border: 1px solid #CFCBC4; border-radius: 10px; padding: 16px; font-size: 15px; color: #1D1C1D">{{draft}}</div>
    </div>
  </div>

  <sc-if value="{{showPanel}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; background: rgba(20,20,22,0.5)"></div>
    <div role="dialog" aria-label="Rewrite" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1120px; border-radius: 18px; background: #F5F5F7; box-shadow: 0 30px 80px rgba(0,0,0,0.35); overflow: hidden">
      <div style="padding: 22px 28px; display: flex; gap: 16px; align-items: baseline; background: #FFFFFF; border-bottom: 1px solid #E4E4E7">
        <span style="flex: none; font-size: 12px; font-weight: 600; color: #6B6B70">你写的</span>
        <span style="font-size: 16px; line-height: 1.5; color: #3A3A3C">{{draft}}</span>
      </div>

      <div style="padding: 24px 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
          <div style="{{o.cardStyle}}">
            <button type="button" onClick="{{o.pick}}" style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0; border: none; background: transparent; color: #1D1D1F">
              <span style="font-size: 14px; font-weight: 700">{{o.label}}</span>
              <span style="{{o.radioStyle}}" aria-hidden="true"></span>
            </button>
            <div style="font-size: 12px; color: #6B6B70">{{o.hint}}</div>
            <sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}">
              <label for="b-edit" style="position: absolute; width: 1px; height: 1px; overflow: hidden">编辑所选改写</label>
              <textarea id="b-edit" value="{{cur}}" onChange="{{onEdit}}" rows="6" style="width: 100%; box-sizing: border-box; resize: none; border: none; border-radius: 8px; padding: 10px; font-size: 16px; line-height: 1.6; color: #1D1D1F; background: #F0F6FF; outline: none"></textarea>
            </sc-if>
            <sc-if value="{{o.off}}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{o.pick}}" style="text-align: left; padding: 10px; border: none; border-radius: 8px; background: transparent; font-size: 16px; line-height: 1.6; color: #3A3A3C; min-height: 160px; align-items: flex-start; display: flex">{{o.text}}</button>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <div style="padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-top: 1px solid #E4E4E7">
        <span style="font-size: 12px; color: #6B6B70">←→ 切换　所选可直接修改　⌘↩ 替换　esc 关闭 · 替换后可撤销，不会发送</span>
        <div style="display: flex; gap: 10px">
          <button type="button" onClick="{{close}}" style="height: 36px; padding: 0 18px; border-radius: 8px; border: 1px solid #D1D1D6; background: #FFFFFF; color: #1D1D1F; font-size: 14px">取消</button>
          <button type="button" onClick="{{apply}}" style="height: 36px; padding: 0 20px; border-radius: 8px; border: none; background: #0A64D6; color: #FFFFFF; font-size: 14px; font-weight: 600">用「{{curLabel}}」替换</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; right: 24px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 22px; background: #1D1D1F; color: #FFFFFF; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.25)">
      <span>已替换</span>
      <button type="button" onClick="{{undo}}" style="height: 30px; padding: 0 12px; border-radius: 15px; border: none; background: #FFFFFF; color: #1D1D1F; font-size: 13px; font-weight: 600">撤销替换</button>
    </div>
  </sc-if>

  <sc-if value="{{isIdle}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{open}}" style="position: absolute; right: 24px; top: 50%; transform: translateY(-50%); height: 36px; padding: 0 16px; border-radius: 18px; border: none; background: #0A64D6; color: #FFFFFF; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(10,100,214,0.35)">✎ Rewrite</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { stage: 'pick', sel: 0, edit: null, applied: null };
  }
  renderVals() {
    const draft0 = 'hi 那个报告我看了 有几个地方数据不对 你明天之前改一下吧 不然周五没法给客户';
    const opts = [
      { label: '简洁直接', hint: '给赶时间的人：结论先行', text: '报告有几处数据需要修正，请明天之前改好，周五要交给客户。' },
      { label: '友好自然', hint: '给同事：轻松、不生硬', text: 'Hi，报告我看过了，整体不错！有几个数据好像不太对，麻烦明天前帮忙改一下，这样周五就能顺利给客户了。' },
      { label: '温和清晰', hint: '给需要讲清楚的人：一句一事', text: '你好，报告我已经看完了。里面有几处数据需要再核对一下。能否在明天之前修改好？因为周五需要发给客户。' },
    ];
    const s = this.state;
    const cur = s.edit ?? opts[s.sel].text;
    return {
      draft: s.stage === 'done' && s.applied ? s.applied : draft0,
      showPanel: s.stage === 'pick',
      isDone: s.stage === 'done',
      isIdle: s.stage === 'idle',
      options: opts.map((o, i) => {
        const on = i === s.sel;
        return {
          ...o, on, off: !on,
          pick: () => { if (!on) this.setState({ sel: i, edit: null }); },
          cardStyle: 'position: relative; display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 14px; background: #FFFFFF; ' + (on ? 'box-shadow: 0 0 0 2px #0A64D6, 0 6px 18px rgba(10,100,214,0.15)' : 'box-shadow: 0 0 0 1px #E0E0E5'),
          radioStyle: 'width: 18px; height: 18px; border-radius: 9px; box-sizing: border-box; ' + (on ? 'border: 5px solid #0A64D6; background: #FFFFFF' : 'border: 1.5px solid #B8B8BE; background: #FFFFFF'),
        };
      }),
      cur,
      curLabel: opts[s.sel].label,
      onEdit: (e) => this.setState({ edit: e.target.value }),
      close: () => this.setState({ stage: 'idle', edit: null }),
      apply: () => this.setState({ stage: 'done', applied: cur }),
      undo: () => this.setState({ stage: 'idle', applied: null, edit: null }),
      open: () => this.setState({ stage: 'pick', edit: null }),
    };
  }
}
</script>
</body>
</html>
