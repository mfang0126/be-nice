<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>A 聚焦面板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0A64D6}a:hover{color:#084FA8}
button{font:inherit;cursor:pointer}
textarea{font:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif; background: #E9E6E1">
  <div aria-hidden="true" style="position: absolute; left: 120px; top: 70px; width: 1200px; height: 760px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 20px 60px rgba(0,0,0,0.18); display: flex; overflow: hidden">
    <div style="width: 240px; background: #3F0E40"></div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; gap: 16px">
      <div style="height: 14px; width: 40%; background: #ECEAE6; border-radius: 7px"></div>
      <div style="height: 14px; width: 62%; background: #ECEAE6; border-radius: 7px"></div>
      <div style="border: 1px solid #CFCBC4; border-radius: 10px; padding: 16px; font-size: 15px; color: #1D1C1D">{{draft}}</div>
    </div>
  </div>

  <sc-if value="{{showPanel}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; background: rgba(20,20,22,0.42)"></div>
    <div role="dialog" aria-label="Rewrite" style="position: absolute; left: 50%; top: 120px; transform: translateX(-50%); width: 720px; border-radius: 16px; background: rgba(250,250,250,0.98); box-shadow: 0 30px 80px rgba(0,0,0,0.35), 0 0 0 0.5px rgba(0,0,0,0.2); overflow: hidden">
      <div style="padding: 18px 22px 14px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid #E4E4E7">
        <div style="font-size: 12px; font-weight: 600; color: #6B6B70; letter-spacing: 0.02em">原文 · Slack</div>
        <div style="font-size: 15px; line-height: 1.5; color: #3A3A3C">{{draft}}</div>
      </div>

      <sc-if value="{{isPick}}" hint-placeholder-val="{{ true }}">
        <div style="padding: 10px; display: flex; flex-direction: column; gap: 4px">
          <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
            <button type="button" onClick="{{o.pick}}" style="{{o.rowStyle}}">
              <span style="{{o.chipStyle}}">{{o.label}}</span>
              <span style="flex: 1; text-align: left; font-size: 15px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{o.text}}</span>
            </button>
          </sc-for>
        </div>
        <div style="padding: 10px 22px; display: flex; align-items: center; justify-content: space-between; background: #F2F2F4; border-top: 1px solid #E4E4E7; font-size: 12px; color: #6B6B70">
          <span>↑↓ 选择　↩ 预览　esc 关闭</span>
          <div style="display: flex; gap: 8px">
            <button type="button" onClick="{{close}}" style="height: 30px; padding: 0 14px; border-radius: 7px; border: 1px solid #D1D1D6; background: #FFFFFF; color: #1D1D1F; font-size: 13px">取消</button>
            <button type="button" onClick="{{toConfirm}}" style="height: 30px; padding: 0 14px; border-radius: 7px; border: none; background: #0A64D6; color: #FFFFFF; font-size: 13px; font-weight: 600">预览 ↩</button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{isConfirm}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 16px 22px 8px; display: flex; flex-direction: column; gap: 8px">
          <label for="a-edit" style="font-size: 12px; font-weight: 600; color: #0A64D6">{{curLabel}} · 可直接修改</label>
          <textarea id="a-edit" value="{{cur}}" onChange="{{onEdit}}" rows="4" style="width: 100%; box-sizing: border-box; resize: none; border: 1.5px solid #0A64D6; border-radius: 10px; padding: 12px 14px; font-size: 16px; line-height: 1.55; color: #1D1D1F; background: #FFFFFF; outline: none"></textarea>
          <div style="font-size: 12px; color: #6B6B70">替换后可一键撤销。不会帮你发送。</div>
        </div>
        <div style="padding: 10px 22px; display: flex; align-items: center; justify-content: space-between; background: #F2F2F4; border-top: 1px solid #E4E4E7">
          <button type="button" onClick="{{back}}" style="height: 30px; padding: 0 12px; border-radius: 7px; border: none; background: transparent; color: #0A64D6; font-size: 13px">‹ 返回选项</button>
          <div style="display: flex; gap: 8px">
            <button type="button" onClick="{{close}}" style="height: 30px; padding: 0 14px; border-radius: 7px; border: 1px solid #D1D1D6; background: #FFFFFF; color: #1D1D1F; font-size: 13px">取消</button>
            <button type="button" onClick="{{apply}}" style="height: 30px; padding: 0 16px; border-radius: 7px; border: none; background: #0A64D6; color: #FFFFFF; font-size: 13px; font-weight: 600">替换 ⌘↩</button>
          </div>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; right: 24px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 22px; background: #1D1D1F; color: #FFFFFF; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.25)">
      <span>已替换</span>
      <button type="button" onClick="{{undo}}" style="height: 30px; padding: 0 12px; border-radius: 15px; border: none; background: #FFFFFF; color: #1D1D1F; font-size: 13px; font-weight: 600">撤销替换</button>
    </div>
  </sc-if>

  <sc-if value="{{isIdle}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{open}}" style="position: absolute; right: 24px; top: 50%; transform: translateY(-50%); height: 36px; padding: 0 16px; border-radius: 18px; border: none; background: #0A64D6; color: #FFFFFF; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(10,100,214,0.35)">✎ Rewrite</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { stage: 'pick', sel: 0, edit: null, applied: null };
  }
  renderVals() {
    const draft0 = 'hi 那个报告我看了 有几个地方数据不对 你明天之前改一下吧 不然周五没法给客户';
    const opts = [
      { label: '简洁直接', text: '报告有几处数据需要修正，请明天之前改好，周五要交给客户。' },
      { label: '友好自然', text: 'Hi，报告我看过了，整体不错！有几个数据好像不太对，麻烦明天前帮忙改一下，这样周五就能顺利给客户了。' },
      { label: '温和清晰', text: '你好，报告我已经看完了。里面有几处数据需要再核对一下。能否在明天之前修改好？因为周五需要发给客户。' },
    ];
    const s = this.state;
    const cur = s.edit ?? opts[s.sel].text;
    return {
      draft: s.stage === 'done' && s.applied ? s.applied : draft0,
      showPanel: s.stage === 'pick' || s.stage === 'confirm',
      isPick: s.stage === 'pick',
      isConfirm: s.stage === 'confirm',
      isDone: s.stage === 'done',
      isIdle: s.stage === 'idle',
      options: opts.map((o, i) => {
        const on = i === s.sel;
        return {
          ...o,
          pick: () => this.setState({ sel: i, edit: null, stage: on ? 'confirm' : 'pick' }),
          rowStyle: 'display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 10px; border: none; color: ' + (on ? '#FFFFFF' : '#1D1D1F') + '; background: ' + (on ? '#0A64D6' : 'transparent'),
          chipStyle: 'flex: none; margin-top: 2px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; ' + (on ? 'background: rgba(255,255,255,0.22); color: #FFFFFF' : 'background: #E8E8ED; color: #3A3A3C'),
        };
      }),
      cur,
      curLabel: opts[s.sel].label,
      onEdit: (e) => this.setState({ edit: e.target.value }),
      toConfirm: () => this.setState({ stage: 'confirm' }),
      back: () => this.setState({ stage: 'pick' }),
      close: () => this.setState({ stage: 'idle', edit: null }),
      apply: () => this.setState({ stage: 'done', applied: cur }),
      undo: () => this.setState({ stage: 'idle', applied: null, edit: null }),
      open: () => this.setState({ stage: 'pick', edit: null }),
    };
  }
}
</script>
</body>
</html>
