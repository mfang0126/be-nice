<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>be-nice · Rewrite 草图</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#25312c;background:#e9ede7;font:15px -apple-system,BlinkMacSystemFont,sans-serif}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #81bfa6;outline-offset:3px}main{max-width:800px;margin:12vh auto;background:white;border-radius:18px;padding:32px;box-shadow:0 15px 65px #243b2410}h1{font-size:14px;font-weight:500;color:#829086;margin:0 0 28px}#source{font-size:23px;line-height:1.7;min-height:220px;outline:none}.green{background:#237853;color:white;border:0;border-radius:10px;padding:12px 20px}.muted{color:#86928b;font-size:12px}.dock{position:fixed;right:18px;bottom:26px;display:flex;gap:8px;align-items:center}.quiet{border:1px solid #d9e2dc;background:#fff;border-radius:10px;padding:11px 17px;color:#53675b}dialog{width:100vw;max-width:none;height:100dvh;max-height:none;border:0;margin:0;padding:32px;background:#f5f7f2f5;color:inherit;overflow:auto}dialog::backdrop{background:#e8eee8cc;backdrop-filter:blur(14px)}.stage{max-width:700px;margin:6vh auto}.top{display:flex;align-items:center;gap:9px;margin-bottom:38px;color:#3e7258;font-weight:600}.top button{margin-left:auto;background:transparent;border:0;font-size:25px;color:#87948b}.label{font-size:11px;letter-spacing:2px;color:#8a978d}.original{font-size:19px;line-height:1.6;color:#7c887f;margin:12px 0 35px;max-height:20vh;overflow:auto;white-space:pre-wrap}.option{display:block;text-align:left;width:100%;border:1px solid transparent;border-radius:14px;background:transparent;padding:20px 23px;margin:8px 0;color:inherit}.option.selected{background:white;border-color:#7eae91;box-shadow:0 6px 24px #2c55340a}.option small{display:block;color:#6f897a;font-size:12px;margin-bottom:9px}.option span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:21px;line-height:1.5}.footer{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:28px}.keys{font-size:12px;color:#8a978d}textarea{width:100%;min-height:220px;max-height:45vh;resize:vertical;border:1px solid #b7cdbd;border-radius:14px;padding:24px;background:white;color:#263d30;font-size:22px;line-height:1.65;margin-top:12px}.hidden{display:none!important}#notice{min-height:20px;color:#557b60;font-size:13px}.prototype{position:fixed;bottom:15px;left:24px;font-size:11px;color:#9aa59b}@media(max-width:760px){main{margin:50px 16px;padding:24px}dialog{padding:22px}.stage{margin:2vh auto}.footer{flex-wrap:wrap}.option span{font-size:18px}}
</style>
<main><h1>消息草稿</h1><div id="source" contenteditable="true" role="textbox" aria-label="原始消息">请今天下午三点前把修改稿发给我，否则今天没法发布。</div><p class="muted">这是模拟输入框。草图使用固定候选文案，不连接模型。</p></main>
<div class="dock"><span id="notice" role="status"></span><button id="undo" class="quiet hidden" onclick="undoEdit()">撤销替换</button><button id="launch" class="green" onclick="openPicker()">✦ Rewrite</button></div>
<dialog id="overlay" aria-label="选择改写"><div class="stage"><div class="top">✦ be-nice<button aria-label="关闭" onclick="closePicker()">×</button></div><div class="label">原文</div><p class="original" id="original"></p>
<section id="choose"><div class="label">选择一种表达</div><div id="options"></div><div class="footer"><span class="keys">↑ ↓ 选择　·　Enter 展开　·　Esc 退出</span><button class="green" onclick="expand()">查看全文 ↵</button></div></section>
<section id="preview" class="hidden"><div class="label" id="style"></div><textarea id="rewrite" aria-label="编辑改写全文"></textarea><div class="footer"><button class="quiet" onclick="back()">← 返回选项</button><span class="keys">可编辑　·　⌘ Enter 确认替换</span><button class="green" onclick="applyEdit()">确认替换</button></div><p id="error" role="alert"></p></section></div></dialog><div class="prototype">交互草图 · 仅修改本页示例</div>
<script>
const $=id=>document.getElementById(id),choices=[['简洁直接','请在今天下午三点前发来修改稿，否则今天无法发布。'],['友好自然','麻烦你在今天下午三点前把修改稿发给我，否则今天就没法发布了。'],['温和清晰','为了今天能发布，需要你在今天下午三点前发来修改稿；如果赶不上这个时间，今天就无法发布。']];let selected=0,mode='choose',captured='',record=null;
choices.forEach(([name,text],i)=>{const b=document.createElement('button');b.className='option';b.innerHTML='<small></small><span></span>';b.children[0].textContent=name;b.children[1].textContent=text;b.onclick=()=>{select(i);expand()};$('options').append(b)});
function select(i){selected=(i+choices.length)%choices.length;[...$('options').children].forEach((b,n)=>{b.classList.toggle('selected',n===selected);b.setAttribute('aria-pressed',String(n===selected))})}
function openPicker(){captured=$('source').textContent;$('original').textContent=captured;$('error').textContent='';mode='choose';$('choose').classList.remove('hidden');$('preview').classList.add('hidden');select(0);$('overlay').showModal();$('options').children[0].focus()}
function closePicker(){$('overlay').close();$('launch').focus()}
function expand(){mode='preview';$('choose').classList.add('hidden');$('preview').classList.remove('hidden');$('style').textContent=choices[selected][0]+' · 确认全文';$('rewrite').value=choices[selected][1];$('rewrite').focus()}
function back(){mode='choose';$('preview').classList.add('hidden');$('choose').classList.remove('hidden');$('options').children[selected].focus()}
function applyEdit(){const text=$('rewrite').value;if(!text.trim()){$('error').textContent='请输入改写内容。';return}if($('source').textContent!==captured){$('error').textContent='原文已变化，请关闭后重新开始。';return}record={before:captured,after:text};$('source').textContent=text;closePicker();$('undo').classList.remove('hidden');$('notice').textContent='已替换'}
function undoEdit(){if(!record)return;if($('source').textContent!==record.after){$('notice').textContent='已有新修改，无法安全撤销';return}$('source').textContent=record.before;record=null;$('undo').classList.add('hidden');$('notice').textContent='已恢复原文'}
$('overlay').addEventListener('cancel',e=>{e.preventDefault();mode==='preview'?back():closePicker()});$('overlay').addEventListener('keydown',e=>{if(mode==='choose'&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){e.preventDefault();if(e.key==='Enter')expand();else{select(selected+(e.key==='ArrowDown'?1:-1));$('options').children[selected].focus()}}else if(mode==='preview'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();applyEdit()}});openPicker();
</script></html>
